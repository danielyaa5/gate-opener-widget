name: GateOpener
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # Pass DEVELOPMENT_TEAM and your own GATE_BUNDLE_PREFIX when building.
    GATE_BUNDLE_PREFIX: org.example
    GATE_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(GATE_BUNDLE_PREFIX).GateOpener.shared
    CURRENT_PROJECT_VERSION: 17
    MARKETING_VERSION: 1.0.0
targets:
  GateOpener:
    type: application
    platform: iOS
    sources:
      - path: ../assets/iOS.xcassets
      - path: GateOpener/App
      - path: GateOpener/Shared
        excludes:
          - "LocalConfiguration.swift*"
    info:
      path: GateOpener/App/Info.plist
      properties:
        GateKeychainAccessGroup: $(GATE_KEYCHAIN_GROUP)
    entitlements:
      path: GateOpener/App/GateOpener.entitlements
      properties:
        keychain-access-groups:
          - $(GATE_KEYCHAIN_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GATE_BUNDLE_PREFIX).GateOpener
        PRODUCT_NAME: Gate Opener
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gate Opener
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Mac to securely control the front gate.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: GateOpenerWidget
        embed: true
  GateOpenerWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GateOpener/Shared
        excludes:
          - "LocalConfiguration.swift*"
      - path: GateOpenerWidget
    entitlements:
      path: GateOpenerWidget/GateOpenerWidget.entitlements
      properties:
        keychain-access-groups:
          - $(GATE_KEYCHAIN_GROUP)
    info:
      path: GateOpenerWidget/Info.plist
      properties:
        GateKeychainAccessGroup: $(GATE_KEYCHAIN_GROUP)
        CFBundleDisplayName: Gate Opener Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GATE_BUNDLE_PREFIX).GateOpener.widget
        PRODUCT_NAME: Gate Opener Widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  GateOpener:
    shared: true
    build:
      targets:
        GateOpener: all
    run:
      config: Debug
